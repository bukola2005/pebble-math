<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ==========================================================
         Change SITE URL in four places if the domain differs:
         canonical, og:url, og:image, twitter:image, and sitemap.xml
         ========================================================== -->
    <title>Pebble Math — a math game for kids who learn by doing</title>
    <meta
      name="description"
      content="Pebble Math is a 2D math game for children aged 7–10. Kids combine objects, spend from a wallet and build number sense inside one connected market."
    />
    <link rel="canonical" href="https://pebblemath.com/" />
    <meta name="theme-color" content="#99A6F9" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social cards -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pebble Math" />
    <meta property="og:title" content="Pebble Math — a math game for kids who learn by doing" />
    <meta
      property="og:description"
      content="A 2D math game for children aged 7–10. Kids combine objects, spend from a wallet and build number sense inside one connected market."
    />
    <meta property="og:url" content="https://pebblemath.com/" />
    <meta property="og:image" content="https://pebblemath.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A Pebble Math market stall with a crate of apples, a basket and the Pebble Math character"
    />
    <meta property="og:locale" content="en_NG" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pebble Math — a math game for kids who learn by doing" />
    <meta
      name="twitter:description"
      content="A 2D math game for children aged 7–10. Kids combine objects, spend from a wallet and build number sense inside one connected market."
    />
    <meta name="twitter:image" content="https://pebblemath.com/og-image.png" />

    <!-- Fonts: Satoshi for everything, Fredoka One for headlines,
         prompts and buttons. Plus Jakarta Sans is Satoshi's fallback.
         Both Google families come in one request. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,800,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka+One&display=swap"
      rel="stylesheet"
    />

    <!-- What the product is, in a form search engines can read.
         Nothing here is a claim we can't stand behind: no ratings,
         no download counts, no prices. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Pebble Math",
        "url": "https://pebblemath.com/",
        "applicationCategory": "EducationalApplication",
        "applicationSubCategory": "Math game",
        "description": "A 2D math game for children aged 7 to 10. Children learn counting, addition, subtraction, multiplication, division, money and saving by handling objects and spending from a wallet inside one connected market.",
        "inLanguage": "en",
        "audience": {
          "@type": "EducationalAudience",
          "educationalRole": "student",
          "audienceType": "Children aged 7-10"
        },
        "teaches": [
          "Counting",
          "Addition",
          "Subtraction",
          "Multiplication",
          "Division",
          "Money and saving"
        ],
        "image": "https://pebblemath.com/og-image.png"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
